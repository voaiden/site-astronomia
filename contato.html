<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Astronomia e Exploração Espacial</title>
    
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilo Próprio -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-dark text-light">

    <!-- 1. NAVBAR / MENU DE NAVEGAÇÃO -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="./index.html">🚀 Espaço & Ciência</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="./index.html">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="./sobre.html">Sobre</a></li>
                    <li class="nav-item"><a class="nav-link" href="./galeria.html">Galeria</a></li>
                    <li class="nav-item"><a class="nav-link" href="./dados.html">Dados</a></li>
                    <li class="nav-item"><a class="nav-link active" href="./contato.html">Contato</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 2. CABEÇALHO DA PÁGINA -->
    <header class="text-center py-5 bg-secondary text-white">
        <div class="container">
            <h1 class="display-4 fw-bold">Entre em Contato</h1>
            <p class="lead">Envie suas dúvidas, sugestões ou comentários sobre o projeto de exploração espacial.</p>
        </div>
    </header>

    <!-- 3. CONTEÚDO PRINCIPAL (FORMULÁRIO DE CONTATO) -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="bg-black p-4 p-md-5 rounded shadow border border-secondary">
                    
                    <form action="#" method="POST">
                        
                        <!-- Campo: Nome -->
                        <div class="mb-3">
                            <label for="nome" class="form-label fw-bold">Nome Completo</label>
                            <input type="text" class="form-control bg-dark text-light border-secondary" id="nome" placeholder="Digite seu nome completo" required>
                        </div>

                        <!-- Campo: E-mail -->
                        <div class="mb-3">
                            <label for="email" class="form-label fw-bold">E-mail</label>
                            <input type="email" class="form-control bg-dark text-light border-secondary" id="email" placeholder="nome@exemplo.com" required>
                        </div>

                        <!-- Campo: Assunto (form-select) -->
                        <div class="mb-3">
                            <label for="assunto" class="form-label fw-bold">Assunto</label>
                            <select class="form-select bg-dark text-light border-secondary" id="assunto" required>
                                <option value="" selected disabled>Selecione um assunto...</option>
                                <option value="duvida">Dúvida sobre o conteúdo</option>
                                <option value="sugestao">Sugestão de melhoria</option>
                                <option value="parceria">Parceria/Projeto</option>
                                <option value="outro">Outro assunto</option>
                            </select>
                        </div>

                        <!-- Campo: Mensagem -->
                        <div class="mb-3">
                            <label for="mensagem" class="form-label fw-bold">Mensagem</label>
                            <textarea class="form-control bg-dark text-light border-secondary" id="mensagem" rows="5" placeholder="Escreva sua mensagem aqui..." required></textarea>
                        </div>

                        <!-- Campo: Checkbox (form-check) -->
                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input bg-dark border-secondary" id="novidades">
                            <label class="form-check-label" for="novidades">
                                Quero receber novidades e atualizações sobre notícias espaciais.
                            </label>
                        </div>

                        <!-- Botão de Envio (btn) -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold">Enviar Mensagem</button>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </main>

    <!-- 4. RODAPÉ (FOOTER) -->
    <footer class="bg-black text-center text-white-50 py-4 mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 Astronomia e Exploração Espacial. Projeto Acadêmico.</p>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
